version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use $VERSION_NODE_18
        - node -v
        - npm install
    build:
      commands:
        - echo "PUBLIC_STADIA_API_KEY=$PUBLIC_STADIA_API_KEY" >> .env
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
