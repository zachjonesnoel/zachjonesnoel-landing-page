version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install $(cat .nvmrc)
        - nvm use $(cat .nvmrc)
        - npm ci
    build:
      commands:
        - npm run build
        - mkdir -p .amplify-hosting/static
        - cp -r dist/* .amplify-hosting/static/
        - cp deploy-manifest.json .amplify-hosting/deploy-manifest.json || true
        - |
          echo '{
            "version": 1,
            "routes": [
              {
                "path": "/*",
                "target": {
                  "kind": "Static"
                }
              }
            ]
          }' > .amplify-hosting/deploy-manifest.json
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*